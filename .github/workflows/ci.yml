name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile and verify functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi

      - name: Cache agbcc
        id: agbcc-cache
        uses: actions/cache@v4
        with:
          path: ~/ffta-toolchain/agbcc
          key: agbcc-${{ runner.os }}-v1

      - name: Build agbcc
        if: steps.agbcc-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffta-toolchain
          cd ~/ffta-toolchain
          git clone --depth 1 https://github.com/pret/agbcc.git
          cd agbcc
          # build.sh also builds libgcc/libc, which needs an ARM assembler on
          # PATH under a name it expects. The compilers themselves are produced
          # first, so a non-zero exit here is expected and harmless.
          ./build.sh > build.log 2>&1 || true
          test -x ./agbcc || { tail -40 build.log; exit 1; }

      - name: Compile all decompiled functions
        env:
          FFTA_TOOLCHAIN: /home/runner/ffta-toolchain
          ARM_AS: /usr/bin/arm-none-eabi-as
        run: bash tools/compile_src.sh build/obj

      - name: Verify every function compiles to the expected bytes
        run: python3 tools/verify_functions.py data/functions.json build/obj

      - name: Check object sizes against the function index
        run: |
          python3 - <<'PY'
          import json, sys, os
          sys.path.insert(0, "tools")
          import check_obj_sizes as c
          idx = json.load(open("data/functions.json"))
          bad = []
          for f in idx["functions"]:
              p = os.path.join("build/obj", f["object"] + ".o")
              n = c.text_size(p)
              if n is None or n < f["size"]:
                  bad.append((f["name"], f["size"], n))
          if bad:
              for name, want, got in bad:
                  print(f"{name}: expected at least {want} bytes, got {got}")
              sys.exit(1)
          print(f"{len(idx['functions'])} object(s) are at least their function size")
          PY
